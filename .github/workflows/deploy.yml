# ALTERNATIVE, NOT THE ACTIVE ONE. Builds the React app with Vite and publishes
# dist/ instead of docs/.
#
# pages.yml is what actually deploys the site (it runs tools/build_preview.mjs,
# which needs nothing installed). This one needs `npm install` to succeed and
# has never been run against this repo, so its push trigger is OFF on purpose —
# two workflows both deploying to Pages would race each other.
#
# To try it: Actions -> "Deploy site (vite, alternative)" -> Run workflow.
# If it works and you would rather ship the real Vite build, disable pages.yml
# first, then add the push trigger back here.

name: Deploy site (vite, alternative)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # no package-lock.json is committed, so `npm install`, not `npm ci`
      - run: npm install
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
